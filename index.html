<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>PKN Quest - Kelas 12</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
  html, body {
    height: 100%; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    background: #050818; color: #fff;
  }
  #app {
    max-width: 480px; height: 100dvh; margin: 0 auto; position: relative; overflow: hidden;
    background: radial-gradient(circle at 20% 0%, #1a2a5c 0%, #0a1230 55%, #050818 100%);
  }
  .screen {
    position: absolute; inset: 0; display: none; flex-direction: column;
    padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); overflow-y: auto;
  }
  .screen.active { display: flex; animation: fadeIn .35s ease; }
  .screen.overlay { padding: 0; justify-content: center; align-items: center; overflow: hidden; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px);} to {opacity:1; transform: none;} }

  .home-header { text-align: center; margin: 8px 0 18px; }
  .home-header h1 {
    font-size: 30px; font-weight: 900; letter-spacing: 2px;
    background: linear-gradient(90deg,#ffd76a,#ff5a5a,#ffd76a);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .home-header p { color: #93a4d8; font-size: 12px; margin-top: 4px; letter-spacing: .5px; }

  .home-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .stat {
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
    border-radius: 14px; padding: 12px; text-align: center; backdrop-filter: blur(8px);
  }
  .stat span { display: block; font-size: 22px; font-weight: 800; color: #ffd76a; }
  .stat small { font-size: 11px; color: #93a4d8; letter-spacing: 1px; text-transform: uppercase; }

  .level-list { display: flex; flex-direction: column; gap: 12px; flex: 1; }
  .level-card {
    background: linear-gradient(135deg, rgba(255,255,255,.09), rgba(255,255,255,.03));
    border: 1px solid rgba(255,255,255,.14); border-radius: 16px; padding: 14px 16px;
    display: flex; align-items: center; gap: 14px; cursor: pointer;
    transition: transform .15s ease; position: relative; overflow: hidden;
  }
  .level-card:active { transform: scale(.97); }
  .level-card.completed { border-color: rgba(120,255,160,.4); background: linear-gradient(135deg, rgba(120,255,160,.14), rgba(120,255,160,.03)); }
  .level-icon {
    width: 46px; height: 46px; border-radius: 12px;
    background: linear-gradient(135deg,#ffd76a,#ff8b3d);
    display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0;
    box-shadow: 0 4px 14px rgba(255,180,60,.35);
  }
  .level-info { flex: 1; min-width: 0; }
  .level-info .bab { font-size: 10px; letter-spacing: 2px; color: #ffd76a; font-weight: 800; }
  .level-info .ttl { font-size: 14px; font-weight: 700; margin-top: 2px; line-height: 1.25; }
  .level-info .sub { font-size: 11px; color: #93a4d8; margin-top: 3px; }
  .level-status { font-size: 22px; flex-shrink: 0; }

  .btn-garden {
    margin-top: 14px; padding: 14px; border-radius: 14px; font-size: 15px; font-weight: 800;
    background: linear-gradient(135deg,#2fbf6b,#1a8a4a); color: #fff; border: none;
    cursor: pointer; letter-spacing: 1px; box-shadow: 0 6px 20px rgba(47,191,107,.35);
  }
  .btn-garden:active { transform: scale(.97); }

  .mat-top { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .btn-back {
    width: 38px; height: 38px; border-radius: 10px; border: 1px solid rgba(255,255,255,.16);
    background: rgba(255,255,255,.06); color: #fff; font-size: 18px; cursor: pointer; flex-shrink: 0;
  }
  .mat-info { flex: 1; min-width: 0; }
  .mat-bab { font-size: 10px; letter-spacing: 2px; color: #ffd76a; font-weight: 800; }
  .mat-title { font-size: 14px; font-weight: 700; line-height: 1.25; }

  .mat-body {
    background: linear-gradient(135deg, rgba(255,255,255,.08), rgba(255,255,255,.02));
    border: 1px solid rgba(255,255,255,.14); border-radius: 16px; padding: 16px;
    line-height: 1.55; font-size: 13.5px; color: #dbe3ff;
    margin-bottom: 14px; flex: 1;
  }
  .mat-body h3 {
    font-size: 14px; color: #ffd76a; margin: 14px 0 6px; letter-spacing: .5px;
  }
  .mat-body h3:first-child { margin-top: 0; }
  .mat-body p { margin-bottom: 8px; }
  .mat-body ul { margin: 6px 0 10px 18px; }
  .mat-body li { margin-bottom: 4px; }
  .mat-body .highlight {
    background: rgba(255,215,106,.13); border-left: 3px solid #ffd76a;
    padding: 8px 12px; border-radius: 6px; margin: 8px 0; font-size: 12.5px; color: #ffe9b8;
  }

  .btn-start-quiz {
    padding: 15px; border-radius: 14px; font-size: 15px; font-weight: 800;
    background: linear-gradient(135deg,#ffd76a,#ff8b3d); color: #2a1a00;
    border: none; cursor: pointer; letter-spacing: 1px;
    box-shadow: 0 6px 22px rgba(255,180,60,.45);
  }
  .btn-start-quiz:active { transform: scale(.97); }

  .quiz-top { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .quiz-info { flex: 1; min-width: 0; }
  .quiz-bab { font-size: 10px; letter-spacing: 2px; color: #ffd76a; font-weight: 800; }
  .quiz-title { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .quiz-progress { font-size: 12px; color: #93a4d8; font-weight: 700; }

  .progress-bar { height: 6px; background: rgba(255,255,255,.1); border-radius: 4px; overflow: hidden; margin-bottom: 16px; }
  #progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg,#ffd76a,#ff5a5a); border-radius: 4px; transition: width .3s ease; }

  .question-card {
    background: linear-gradient(135deg, rgba(255,255,255,.09), rgba(255,255,255,.03));
    border: 1px solid rgba(255,255,255,.14); border-radius: 16px; padding: 16px; margin-bottom: 14px;
  }
  .q-number { font-size: 11px; letter-spacing: 2px; color: #ffd76a; font-weight: 800; margin-bottom: 6px; }
  .q-text { font-size: 15px; line-height: 1.45; font-weight: 600; }

  .options { display: flex; flex-direction: column; gap: 10px; }
  .opt {
    text-align: left; padding: 14px 16px; border-radius: 14px; font-size: 14px; line-height: 1.35;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.14);
    color: #fff; cursor: pointer; display: flex; gap: 12px; align-items: flex-start;
    transition: transform .12s ease; font-family: inherit;
  }
  .opt:active { transform: scale(.98); background: rgba(255,255,255,.12); }
  .opt .letter {
    width: 26px; height: 26px; border-radius: 8px; flex-shrink: 0;
    background: linear-gradient(135deg,#3a4a8a,#2a3a6a);
    display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px;
  }
  .opt.correct { background: linear-gradient(135deg, rgba(47,191,107,.35), rgba(47,191,107,.1)); border-color: #2fbf6b; }
  .opt.wrong { background: linear-gradient(135deg, rgba(255,60,60,.35), rgba(255,60,60,.1)); border-color: #ff3c3c; }
  .opt:disabled { cursor: default; }

  #screen-feedback, #screen-reward {
    background: radial-gradient(circle at 50% 40%, #16224a 0%, #060a1e 80%);
  }
  #fb-canvas, #reward-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

  .fb-content {
    position: relative; z-index: 2; display: flex; flex-direction: column;
    align-items: center; justify-content: center; width: 100%; height: 100%;
    padding: 40px 24px; text-align: center;
  }
  .pancasila-wrap {
    position: relative; width: 200px; height: 200px; margin-bottom: 8px;
    filter: drop-shadow(0 12px 30px rgba(0,0,0,.55));
    animation: emblemIn .6s cubic-bezier(.2,.9,.3,1.3);
  }
  @keyframes emblemIn {
    0% { transform: scale(.3) rotate(-12deg); opacity: 0; }
    60% { transform: scale(1.08) rotate(3deg); opacity: 1; }
    100% { transform: scale(1) rotate(0); opacity: 1; }
  }
  .pancasila-wrap svg { width: 100%; height: 100%; display: block; }

  .fb-text {
    font-size: 28px; font-weight: 900; letter-spacing: 3px;
    text-shadow: 0 4px 24px rgba(0,0,0,.6); margin-bottom: 4px;
  }
  .fb-text.ok { color: #6cff9a; }
  .fb-text.no { color: #ff5a5a; }

  .fb-sub {
    font-size: 13px; color: #c8d3f5; padding: 0 12px; line-height: 1.45;
    max-width: 320px; margin-bottom: 16px;
  }

  .btn-primary {
    padding: 14px 34px; border-radius: 14px; font-size: 15px; font-weight: 800;
    background: linear-gradient(135deg,#ffd76a,#ff8b3d); color: #2a1a00;
    border: none; cursor: pointer; letter-spacing: 1px;
    box-shadow: 0 8px 26px rgba(255,180,60,.45);
  }
  .btn-primary:active { transform: scale(.96); }
  .btn-primary.hidden { display: none; }

  .reward-badge {
    position: relative; font-size: 56px; z-index: 2;
    opacity: 0; transition: opacity .5s ease;
  }
  .reward-badge.show { opacity: 1; animation: pop .6s ease; }
  @keyframes pop { 0%{transform:scale(.3);} 60%{transform:scale(1.2);} 100%{transform:scale(1);} }
  .reward-text {
    position: relative; z-index: 2; font-size: 15px; font-weight: 700;
    color: #ffd76a; padding: 0 24px; text-align: center; margin-top: 8px; line-height: 1.4;
  }
  #screen-reward .fb-content { justify-content: flex-end; padding-bottom: 100px; }

  .garden-header { text-align: center; margin-bottom: 8px; }
  .garden-header h2 { font-size: 22px; font-weight: 900; color: #6cff9a; }
  .garden-header p { font-size: 12px; color: #93a4d8; margin-top: 4px; }
  #garden-canvas { flex: 1; width: 100%; min-height: 320px; border-radius: 16px; }

  ::-webkit-scrollbar { width: 0; height: 0; }
</style>
</head>
<body>
<div id="app">

  <div id="screen-home" class="screen active">
    <div class="home-header">
      <h1>PKN QUEST</h1>
      <p>KELAS 12 · KURIKULUM MERDEKA · SEMESTER 1</p>
    </div>
    <div class="home-stats">
      <div class="stat"><span id="stat-plants">0</span><small>Tanaman</small></div>
      <div class="stat"><span id="stat-levels">0/4</span><small>Level Selesai</small></div>
    </div>
    <div class="level-list" id="level-list"></div>
    <button class="btn-garden" id="btn-garden">🌱 Lihat Kebun Pancasila</button>
  </div>

  <div id="screen-material" class="screen">
    <div class="mat-top">
      <button class="btn-back" id="mat-back">←</button>
      <div class="mat-info">
        <div class="mat-bab" id="mat-bab">BAB 1</div>
        <div class="mat-title" id="mat-title">—</div>
      </div>
    </div>
    <div class="mat-body" id="mat-body"></div>
    <button class="btn-start-quiz" id="btn-start-quiz">📝 Mulai Kuis (10 Soal)</button>
  </div>

  <div id="screen-quiz" class="screen">
    <div class="quiz-top">
      <button class="btn-back" id="btn-back">←</button>
      <div class="quiz-info">
        <div class="quiz-bab" id="quiz-bab">BAB 1</div>
        <div class="quiz-title" id="quiz-title">—</div>
      </div>
      <div class="quiz-progress" id="quiz-progress">1/10</div>
    </div>
    <div class="progress-bar"><div id="progress-fill"></div></div>
    <div class="question-card">
      <div class="q-number" id="q-number">SOAL 1</div>
      <div class="q-text" id="q-text">—</div>
    </div>
    <div class="options" id="options"></div>
  </div>

  <div id="screen-feedback" class="screen overlay">
    <canvas id="fb-canvas"></canvas>
    <div class="fb-content">
      <div class="pancasila-wrap" id="pancasila-wrap"></div>
      <div class="fb-text" id="fb-text">BENAR!</div>
      <div class="fb-sub" id="fb-sub"></div>
      <button class="btn-primary hidden" id="fb-btn">Ulangi Level</button>
    </div>
  </div>

  <div id="screen-reward" class="screen overlay">
    <canvas id="reward-canvas"></canvas>
    <div class="fb-content">
      <div class="reward-badge" id="reward-badge">🏅</div>
      <div class="reward-text" id="reward-text"></div>
      <button class="btn-primary hidden" id="reward-btn" style="margin-top:20px;">Kembali ke Beranda</button>
    </div>
  </div>

  <div id="screen-garden" class="screen">
    <div class="garden-header">
      <h2>🌿 Kebun Pancasila</h2>
      <p>Setiap level yang selesai menumbuhkan 1 tanaman berbunga & berbuah</p>
    </div>
    <canvas id="garden-canvas"></canvas>
    <button class="btn-primary" id="garden-back" style="position:static; transform:none; margin-top:12px;">Kembali</button>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* =========================================================
   DATA: MATERI + SOAL
   ========================================================= */
const QUIZ_DATA = [
  {
    id: 1, bab: 'BAB 1', title: 'Hak dan Kewajiban Warga Negara', icon: '⚖️',
    material: `
      <h3>📖 Pengertian Hak dan Kewajiban</h3>
      <p><b>Hak</b> adalah sesuatu yang mutlak menjadi milik seseorang dan penggunaannya bergantung pada diri sendiri. <b>Kewajiban</b> adalah sesuatu yang harus dilaksanakan dengan penuh tanggung jawab.</p>

      <h3>⚖️ Dasar Hukum di UUD NRI 1945</h3>

        <li><b>Pasal 31</b> — hak mendapat pendidikan</li>
        <li><b>Pasal 33 & 34</b> — kesejahteraan sosial & ekonomi</li>
      </ul>
      <h3>🇮🇩 Contoh Hak Warga Negara</h3>
      <ul>
        <li>Hak hidup dan mempertahankan kehidupan</li>
        <li>Hak memeluk agama dan beribadah</li>
        <li>Hak mendapat pendidikan</li>
        <li>Hak memilih dan dipilih dalam pemilu</li>
        <li>Hak mendapat perlindungan hukum</li>
      </ul>
      <h3>🤝 Contoh Kewajiban Warga Negara</h3>
      <ul>
        <li>Membayar pajak tepat waktu</li>

        <li>Menghormati hak orang lain</li>
        <li>Menaati hukum yang berlaku</li>
        <li>Ikut serta dalam pembangunan nasional</li>
      </ul>
      <h3>💡 Nilai Pancasila Terkait</h3>
      <p>Sila <b>kedua</b> (Kemanusiaan yang adil dan beradab) dan sila <b>kelima</b> (Keadilan sosial) menjadi landasan moral dalam mewujudkan keseimbangan hak dan kewajiban seluruh warga negara.</p>
    `,
    questions: [
      { q: 'Hak warga negara untuk memeluk agama dijamin dalam UUD NRI 1945 pasal...', options: ['Pasal 27','Pasal 28','Pasal 29','Pasal 30'], answer: 2 },

      { q: 'Pasal 27 ayat 1 UUD NRI 1945 mengatur tentang...', options: ['Kesamaan kedudukan di depan hukum','Hak beragama','Hak pendidikan','Hak berserikat'], answer: 0 },

      { q: 'Hak asasi manusia yang paling mendasar adalah hak untuk...', options: ['Hidup','Kaya','Berkuasa','Terkenal'], answer: 0 },
      { q: 'Membayar pajak tepat waktu merupakan wujud...', options: ['Hak warga','Kewajiban warga','Hobi','Prestasi pribadi'], answer: 1 },
      { q: 'Hak warga negara dalam bidang politik adalah...', options: ['Mendapat pendidikan','Memilih dalam pemilu','Mendapat pekerjaan','Mendapat layanan kesehatan'], answer: 1 },

  {
    id: 2, bab: 'BAB 2', title: 'Dinamika Persatuan & Kesatuan Bangsa', icon: '🇮🇩',
    material: `
      <h3>🇮🇩 Bhinneka Tunggal Ika</h3>
      <p>Semboyan bangsa Indonesia yang berarti <b>"berbeda-beda tetapi tetap satu"</b>. Menjadi perekat keberagaman suku, agama, ras, dan budaya dalam satu kesatuan NKRI.</p>

  {
    id: 3, bab: 'BAB 3', title: 'Sistem Hukum dan Peradilan di Indonesia', icon: '🏛️',
    material: `
      <h3>📖 Pengertian Hukum</h3>
      <p>Hukum adalah kumpulan peraturan yang dibuat oleh negara untuk mengatur tingkah laku manusia dalam masyarakat, bersifat <b>memaksa</b> dan memiliki <b>sanksi tegas</b>.</p>

function starPath(cx, cy, spikes, outer, inner, fill, stroke) {
  let pts = [];
  let rot = -Math.PI / 2;
  const step = Math.PI / spikes;
  for (let i = 0; i < spikes; i++) {
    pts.push([cx + Math.cos(rot) * outer, cy + Math.sin(rot) * outer]);
    rot += step;
    pts.push([cx + Math.cos(rot) * inner, cy + Math.sin(rot) * inner]);
    rot += step;
  }
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ') + ' Z';
  return `<path d="${d}" fill="${fill}" stroke="${stroke}" stroke-width="2"/>`;
}

/* =========================================================

   ========================================================= */
const STORAGE_KEY = 'pkn_quest_v2';
function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return { levels: {}, plants: 0 };
    const obj = JSON.parse(raw);
    return { levels: obj.levels || {}, plants: obj.plants || 0 };
  } catch (e) { return { levels: {}, plants: 0 }; }
}
function saveProgress() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
}

let progress = loadProgress();
let current = { levelIdx: 0, qIdx: 0, score: 0 };

const $ = s => document.querySelector(s);
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

/* =========================================================
   HOME
   ========================================================= */
function renderHome() {
  const list = $('#level-list');
  list.innerHTML = '';
  let completed = 0;
  QUIZ_DATA.forEach((lv, i) => {
    const done = !!progress.levels[lv.id];
    if (done) completed++;
    const card = document.createElement('div');
    card.className = 'level-card' + (done ? ' completed' : '');
    card.innerHTML = `
      <div class="level-icon">${lv.icon}</div>
      <div class="level-info">
        <div class="bab">${lv.bab}</div>
        <div class="ttl">${lv.title}</div>
        <div class="sub">10 soal · ${done ? 'Selesai ✅' : 'Belum selesai'}</div>
      </div>
      <div class="level-status">${done ? '✅' : '▶'}</div>
    `;
    card.addEventListener('click', () => openMaterial(i));
    list.appendChild(card);
  });
  $('#stat-plants').textContent = progress.plants;
  $('#stat-levels').textContent = completed + '/' + QUIZ_DATA.length;
}

/* =========================================================
   MATERIAL
   ========================================================= */
function openMaterial(idx) {
  const lv = QUIZ_DATA[idx];
  current.levelIdx = idx;
  $('#mat-bab').textContent = lv.bab;
  $('#mat-title').textContent = lv.title;
  $('#mat-body').innerHTML = lv.material;
  showScreen('screen-material');
  $('#screen-material').scrollTop = 0;
}

/* =========================================================
   QUIZ
   ========================================================= */
function startLevel(idx) {
  current = { levelIdx: idx, qIdx: 0, score: 0 };
  showScreen('screen-quiz');
  renderQuestion();
}

function renderQuestion() {
  const lv = QUIZ_DATA[current.levelIdx];
  const q = lv.questions[current.qIdx];
  $('#quiz-bab').textContent = lv.bab;
  $('#quiz-title').textContent = lv.title;
  $('#quiz-progress').textContent = (current.qIdx + 1) + '/' + lv.questions.length;
  $('#progress-fill').style.width = ((current.qIdx) / lv.questions.length * 100) + '%';
  $('#q-number').textContent = 'SOAL ' + (current.qIdx + 1);
  $('#q-text').textContent = q.q;

  const optContainer = $('#options');
  optContainer.innerHTML = '';
  const letters = ['A','B','C','D'];
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${opt}</span>`;
    btn.addEventListener('click', () => answer(i));
    optContainer.appendChild(btn);
  });
}

function answer(picked) {
  const lv = QUIZ_DATA[current.levelIdx];
  const q = lv.questions[current.qIdx];
  const isCorrect = picked === q.answer;

  document.querySelectorAll('.opt').forEach((b, i) => {
    b.disabled = true;
    if (i === q.answer) b.classList.add('correct');
    if (i === picked && !isCorrect) b.classList.add('wrong');
  });

  // tampilkan feedback
  setTimeout(() => {
    showScreen('screen-feedback');
    Feedback3D.show(isCorrect);

    if (isCorrect) {
      setTimeout(() => {
        current.qIdx++;
        if (current.qIdx >= lv.questions.length) {
          completeLevel();
        } else {
          showScreen('screen-quiz');
          renderQuestion();
        }
      }, 1800);
    }
  }, 250);
}

/* =========================================================
   COMPLETE LEVEL -> REWARD
   ========================================================= */
function completeLevel() {
  const lv = QUIZ_DATA[current.levelIdx];
  if (!progress.levels[lv.id]) {
    progress.levels[lv.id] = { completed: true, date: Date.now() };
    progress.plants = (progress.plants || 0) + 1;
    saveProgress();
  }
  showScreen('screen-reward');
  $('#reward-text').textContent = `Level ${lv.bab} selesai! Kamu menumbuhkan 1 tanaman berbunga & berbuah 🌸🍎`;
  $('#reward-badge').classList.remove('show');
  $('#reward-btn').classList.add('hidden');
  Reward3D.start(() => {
    $('#reward-badge').classList.add('show');
    $('#reward-btn').classList.remove('hidden');
  });
}

      ctx.lineTo(cx + Math.cos(rot) * outer, cy + Math.sin(rot) * outer);

    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 160, 512, 160);
    drawGaruda(ctx, 256, 155, 105);
    const tex = new THREE.CanvasTexture(c);
    tex.anisotropy = 4;
    return tex;
  }

  function makeCrossOverlay() {
    const c = document.createElement('canvas');
    c.width = 512; c.height = 320;
    const ctx = c.getContext('2d');
    ctx.strokeStyle = '#ff1a1a';
    ctx.lineWidth   = 34;
    ctx.lineCap     = 'round';
    ctx.shadowColor = '#000';
    ctx.shadowBlur  = 26;
    ctx.beginPath();
    ctx.moveTo( 55,  45); ctx.lineTo(457, 275);
    ctx.moveTo(457,  45); ctx.lineTo( 55, 275);
    ctx.stroke();
    return new THREE.CanvasTexture(c);
  }

  function build() {
    if (built) return;
    canvas = document.getElementById('fb-canvas');
    if (!canvas) return;

    const parent = canvas.parentElement;
    const w = parent.clientWidth  || window.innerWidth;
    const h = parent.clientHeight || window.innerHeight;

    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(50, w / h, 0.1, 100);
    camera.position.set(0, 0, 6);

    renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(w, h, false);

    scene.add(new THREE.AmbientLight(0xffffff, 0.95));
    const d1 = new THREE.DirectionalLight(0xffffff, 1.15);
    d1.position.set(2, 3, 5); scene.add(d1);
    const d2 = new THREE.DirectionalLight(0xffd76a, 0.5);
    d2.position.set(-3, -1, 3); scene.add(d2);

    const flagGroup = new THREE.Group();
    flagGroup.position.set(0, -0.2, -1.2);

    // Pole
    const poleMesh = new THREE.Mesh(
      new THREE.CylinderGeometry(0.06, 0.06, 3.0, 12),
      new THREE.MeshStandardMaterial({ color: 0x9aa3b8, metalness: 0.9, roughness: 0.25 })
    );
    poleMesh.position.set(-1.9, 0.2, 0);
    flagGroup.add(poleMesh);

    // Ball
    const ball = new THREE.Mesh(
      new THREE.SphereGeometry(0.1, 16, 12),
      new THREE.MeshStandardMaterial({ color: 0xffd76a, metalness: 0.9, roughness: 0.2 })
    );
    ball.position.set(-1.9, 1.72, 0);
    flagGroup.add(ball);

    // Flag
    flagGeo = new THREE.PlaneGeometry(3.8, 2.4, 32, 22);
    flagBasePositions = flagGeo.attributes.position.array.slice();
    const flagMat = new THREE.MeshStandardMaterial({
      map: makeFlagTexture(),
      side: THREE.DoubleSide,
      roughness: 0.8,
      metalness: 0.05
    });
    const flagMesh = new THREE.Mesh(flagGeo, flagMat);
    flagMesh.position.set(0, 0.2, 0);
    flagGroup.add(flagMesh);

    // X overlay
    xOverlayMesh = new THREE.Mesh(
      new THREE.PlaneGeometry(3.8, 2.4),
      new THREE.MeshBasicMaterial({ map: makeCrossOverlay(), transparent: true, depthTest: false })
    );
    xOverlayMesh.position.set(0, 0.2, 0.02);
    xOverlayMesh.visible = false;
    flagGroup.add(xOverlayMesh);

    scene.add(flagGroup);
    built = true;

    animate();
    window.addEventListener('resize', onResize);
  }

  function onResize() {
    if (!renderer || !canvas) return;
    const parent = canvas.parentElement;
    const w = parent.clientWidth;
    const h = parent.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }

  function animate() {
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();
    if (flagGeo && flagBasePositions) {
      const pos = flagGeo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const bx = flagBasePositions[i * 3];
        const factor = (bx + 1.9) / 3.8;
        let z = 0;
        if (waving) {
          z = Math.sin((bx + 1.9) * 2.8 + t * 5.5) * 0.35 * factor
            + Math.sin((bx + 1.9) * 5.8 + t * 3.2) * 0.08 * factor;
        } else {
          z = Math.sin((bx + 1.9) * 1.2) * 0.015 * factor;
        }
        pos.setZ(i, z);
      }
      pos.needsUpdate = true;
      flagGeo.computeVertexNormals();
    }
    if (renderer && scene && camera) renderer.render(scene, camera);
  }

  function applyState(correct) {
    waving = correct;
    if (xOverlayMesh) xOverlayMesh.visible = !correct;

    const txt  = document.getElementById('fb-text');
    const sub  = document.getElementById('fb-sub');
    const btn  = document.getElementById('fb-btn');
    const wrap = document.getElementById('pancasila-wrap');

    if (wrap && typeof pancasilaSVG === 'function') {
      wrap.innerHTML = pancasilaSVG(correct ? 'correct' : 'wrong');
      wrap.style.animation = 'none';
      void wrap.offsetWidth;
      wrap.style.animation = '';
    }

    if (correct) {
      if (txt) { txt.textContent = 'BENAR! 🇮🇩'; txt.className = 'fb-text ok'; }
      if (sub) sub.textContent = 'Pancasila dijunjung tinggi — bendera Garuda berkibar bangga!';
      if (btn) btn.classList.add('hidden');
    } else {
      if (txt) { txt.textContent = 'SALAH ✕'; txt.className = 'fb-text no'; }
      if (sub) sub.textContent = 'Bendera tidak berkibar. Pancasila disilang! Kamu harus mengulang level ini dari awal.';
      if (btn) { btn.classList.remove('hidden'); btn.textContent = '🔄 Ulangi Level'; }
    }
  }

  function trigger(correct) {
    build();
    requestAnimationFrame(onResize);
    setTimeout(onResize, 50);
    setTimeout(onResize, 200);
    applyState(correct);
  }

  return {
    init: build,
    show: trigger,
    setWaving: trigger
  };
})();

/* =========================================================
   THREE.JS: REWARD (tanaman tumbuh)
   ========================================================= */
const Reward3D = (() => {
  let scene, camera, renderer, canvas;
  let plantGroup, seedMesh, stemMesh, leavesGroup, budMesh, flowerGroup, fruitsGroup;
  let started = false, startTime = 0, callback = null;
  let clock = new THREE.Clock();
  const totalStages = 6;

  function buildPlant() {
    const g = new THREE.Group();

    const pot = new THREE.Mesh(
      new THREE.CylinderGeometry(0.85, 0.65, 0.7, 24),
      new THREE.MeshStandardMaterial({ color: 0x8b4a2b, roughness: 0.9 })
    );
    pot.position.y = -1.4;
    g.add(pot);

    const soil = new THREE.Mesh(
      new THREE.CylinderGeometry(0.82, 0.82, 0.1, 24),
      new THREE.MeshStandardMaterial({ color: 0x3a1f10, roughness: 1 })
    );
    soil.position.y = -1.05;
    g.add(soil);

    seedMesh = new THREE.Mesh(
      new THREE.SphereGeometry(0.18, 16, 12),
      new THREE.MeshStandardMaterial({ color: 0x8a5a2b, roughness: 0.9 })
    );
    seedMesh.scale.set(1, 1.25, 1);
    seedMesh.position.y = -0.95;
    g.add(seedMesh);

    stemMesh = new THREE.Mesh(
      new THREE.CylinderGeometry(0.06, 0.08, 1.8, 12),
      new THREE.MeshStandardMaterial({ color: 0x2f8a3a, roughness: 0.8 })
    );
    stemMesh.position.y = -0.05;
    stemMesh.scale.y = 0.001;
    g.add(stemMesh);

    leavesGroup = new THREE.Group();
    const leafMat = new THREE.MeshStandardMaterial({ color: 0x3fbf55, roughness: 0.7, side: THREE.DoubleSide });
    [[-0.4,0.6,1],[-0.05,-0.6,-1],[0.25,0.8,1],[0.5,-0.8,-1]].forEach(lp => {
      const leaf = new THREE.Mesh(new THREE.SphereGeometry(0.22, 12, 8), leafMat);
      leaf.scale.set(1.4, 0.25, 0.7);
      leaf.position.set(lp[2] * 0.28, lp[0], 0);
      leaf.rotation.z = lp[1] * lp[2];
      leavesGroup.add(leaf);
    });
    leavesGroup.visible = false;
    g.add(leavesGroup);

    budMesh = new THREE.Mesh(
      new THREE.SphereGeometry(0.2, 16, 12),
      new THREE.MeshStandardMaterial({ color: 0xff8fb0, roughness: 0.6 })
    );
    budMesh.position.y = 0.95;
    budMesh.visible = false;
    g.add(budMesh);

    flowerGroup = new THREE.Group();
    const petalMat = new THREE.MeshStandardMaterial({ color: 0xff5a8a, roughness: 0.55 });
    const centerMat = new THREE.MeshStandardMaterial({ color: 0xffd54a, emissive: 0xffaa00, emissiveIntensity: 0.4, roughness: 0.5 });
    flowerGroup.add(new THREE.Mesh(new THREE.SphereGeometry(0.14, 16, 12), centerMat));
    for (let i = 0; i < 8; i++) {
      const petal = new THREE.Mesh(new THREE.SphereGeometry(0.16, 12, 8), petalMat);
      petal.scale.set(1.4, 0.6, 0.9);
      const a = (i / 8) * Math.PI * 2;
      petal.position.set(Math.cos(a) * 0.24, Math.sin(a) * 0.24, 0);
      petal.rotation.z = a;
      flowerGroup.add(petal);
    }
    flowerGroup.position.y = 1.15;
    flowerGroup.visible = false;
    g.add(flowerGroup);

    fruitsGroup = new THREE.Group();
    const fruitMat = new THREE.MeshStandardMaterial({ color: 0xff2a3a, roughness: 0.4, emissive: 0x330000, emissiveIntensity: 0.2 });
    [[0.45,0.1,0.05],[-0.5,-0.3,0.1],[0.35,-0.65,-0.1]].forEach(fo => {
      const f = new THREE.Mesh(new THREE.SphereGeometry(0.18, 16, 12), fruitMat);
      f.position.set(fo[0], fo[1], fo[2]);
      fruitsGroup.add(f);
    });
    fruitsGroup.visible = false;
    g.add(fruitsGroup);

    return g;
  }

  function init() {
    canvas = document.getElementById('reward-canvas');
    scene = new THREE.Scene();
    const w = canvas.parentElement.clientWidth;
    const h = canvas.parentElement.clientHeight;
    camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 100);
    camera.position.set(0, 0.3, 5);
    camera.lookAt(0, 0, 0);

    renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(w, h, false);

    scene.add(new THREE.AmbientLight(0xffffff, 0.95));
    const d1 = new THREE.DirectionalLight(0xffffff, 1.2);
    d1.position.set(3, 5, 4); scene.add(d1);
    const d2 = new THREE.DirectionalLight(0x6cff9a, 0.5);
    d2.position.set(-4, 2, 3); scene.add(d2);

    plantGroup = buildPlant();
    scene.add(plantGroup);

    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(2.5, 32),
      new THREE.MeshBasicMaterial({ color: 0x1f3a6a, transparent: true, opacity: 0.35 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -1.78;
    scene.add(ground);

    animate();
    window.addEventListener('resize', onResize);
  }

  function onResize() {
    if (!renderer || !canvas) return;
    const w = canvas.parentElement.clientWidth;
    const h = canvas.parentElement.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }

  function setStage(stage) {
    seedMesh.visible = stage < 1;
    stemMesh.scale.y = Math.max(0.001, Math.min(1, stage / 3));
    stemMesh.position.y = -0.9 + stemMesh.scale.y * 0.85;
    leavesGroup.visible = stage >= 2;
    if (leavesGroup.visible) leavesGroup.scale.setScalar(Math.min(1, (stage - 1) / 2));
    budMesh.visible = stage >= 3 && stage < 4;
    flowerGroup.visible = stage >= 4;
    if (flowerGroup.visible) flowerGroup.scale.setScalar(Math.min(1, (stage - 3) / 1.5));
    fruitsGroup.visible = stage >= 5;
    if (fruitsGroup.visible) fruitsGroup.scale.setScalar(Math.min(1, (stage - 4) / 1.5));
  }

  function animate() {
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();
    if (started) {
      const elapsed = (performance.now() - startTime) / 1000;
      const progressRatio = Math.min(1, elapsed / 4.5);
      setStage(progressRatio * totalStages);
      plantGroup.rotation.y = Math.sin(t * 0.6) * 0.08;
      if (progressRatio >= 1 && callback) {
        const cb = callback; callback = null;
        cb();
      }
    }
    renderer.render(scene, camera);
  }

  return {
    init,
    start(cb) {
      started = true;
      startTime = performance.now();
      callback = cb;
      setStage(0);
      plantGroup.rotation.y = 0;
      // refresh size
      requestAnimationFrame(onResize);
      setTimeout(onResize, 50);
      setTimeout(onResize, 200);
    }
  };
})();

/* =========================================================
   THREE.JS: GARDEN
   ========================================================= */
const Garden3D = (() => {
  let scene, camera, renderer, canvas, group;
  let clock = new THREE.Clock();
  let inited = false;

  function buildMiniPlant() {
    const g = new THREE.Group();
    const pot = new THREE.Mesh(
      new THREE.CylinderGeometry(0.42, 0.34, 0.5, 20),
      new THREE.MeshStandardMaterial({ color: 0x8b4a2b, roughness: 0.9 })
    );
    pot.position.y = -0.7;
    g.add(pot);

    const soil = new THREE.Mesh(
      new THREE.CylinderGeometry(0.4, 0.4, 0.08, 20),
      new THREE.MeshStandardMaterial({ color: 0x3a1f10 })
    );
    soil.position.y = -0.46;
    g.add(soil);

    const stem = new THREE.Mesh(
      new THREE.CylinderGeometry(0.035, 0.05, 1.0, 10),
      new THREE.MeshStandardMaterial({ color: 0x2f8a3a })
    );
    stem.position.y = 0.05;
    g.add(stem);

    const leafMat = new THREE.MeshStandardMaterial({ color: 0x3fbf55, side: THREE.DoubleSide });
    [[-0.15,0.0,0.6],[0.15,0.25,-0.6]].forEach(lp => {
      const l = new THREE.Mesh(new THREE.SphereGeometry(0.13, 10, 8), leafMat);
      l.scale.set(1.4, 0.28, 0.7);
      l.position.set(lp[0], lp[1], 0);
      l.rotation.z = lp[2];
      g.add(l);
    });

    const flowerG = new THREE.Group();
    flowerG.add(new THREE.Mesh(
      new THREE.SphereGeometry(0.08, 12, 10),
      new THREE.MeshStandardMaterial({ color: 0xffd54a, emissive: 0xffaa00, emissiveIntensity: 0.5 })
    ));
    for (let i = 0; i < 7; i++) {
      const p = new THREE.Mesh(
        new THREE.SphereGeometry(0.09, 10, 8),
        new THREE.MeshStandardMaterial({ color: 0xff5a8a, roughness: 0.5 })
      );
      p.scale.set(1.4, 0.6, 0.9);
      const a = (i / 7) * Math.PI * 2;
      p.position.set(Math.cos(a) * 0.14, Math.sin(a) * 0.14, 0);
      p.rotation.z = a;
      flowerG.add(p);
    }
    flowerG.position.y = 0.58;
    g.add(flowerG);

    const fruitMat = new THREE.MeshStandardMaterial({ color: 0xff2a3a, emissive: 0x330000, emissiveIntensity: 0.25 });
    [[0.22,0.15,0],[-0.24,-0.15,0.05],[0.18,-0.35,-0.05]].forEach(fp => {
      const f = new THREE.Mesh(new THREE.SphereGeometry(0.1, 12, 10), fruitMat);
      f.position.set(fp[0], fp[1], fp[2]);
      g.add(f);
    });

    return g;
  }

  function init() {
    canvas = document.getElementById('garden-canvas');
    scene = new THREE.Scene();
    const w = canvas.parentElement.clientWidth;
    const h = canvas.parentElement.clientHeight || 400;

    camera = new THREE.PerspectiveCamera(50, w / h, 0.1, 100);
    camera.position.set(0, 1.2, 6);
    camera.lookAt(0, 0, 0);

    renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(w, h, false);

    scene.add(new THREE.AmbientLight(0xffffff, 0.9));
    const d = new THREE.DirectionalLight(0xffffff, 1.1);
    d.position.set(2, 5, 4); scene.add(d);
    const d2 = new THREE.DirectionalLight(0x6cff9a, 0.5);
    d2.position.set(-3, 2, 3); scene.add(d2);

    group = new THREE.Group();
    scene.add(group);

    animate();
    window.addEventListener('resize', onResize);
    inited = true;
  }

  function onResize() {
    if (!renderer || !canvas) return;
    const w = canvas.parentElement.clientWidth;
    const h = canvas.parentElement.clientHeight || 400;
    if (!w || !h) return;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }

  function animate() {
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();
    if (group) group.rotation.y = Math.sin(t * 0.3) * 0.15;
    renderer.render(scene, camera);
  }

  return {
    init,
    refresh() {
      if (!group) return;
      while (group.children.length) group.remove(group.children[0]);
      const n = Math.min(progress.plants, 8);
      if (n === 0) return;
      const totalW = (n - 1) * 1.1;
      for (let i = 0; i < n; i++) {
        const p = buildMiniPlant();
        p.position.x = -totalW / 2 + i * 1.1;
        p.position.y = -0.2;
        group.add(p);
      }
      requestAnimationFrame(onResize);
      setTimeout(onResize, 80);
    },
    isInited() { return inited; }
  };
})();

/* =========================================================
   EVENTS
   ========================================================= */
function bindEvents() {
  $('#mat-back').addEventListener('click', () => {
    showScreen('screen-home');
    renderHome();
  });

  $('#btn-start-quiz').addEventListener('click', () => {
    startLevel(current.levelIdx);
  });

  $('#btn-back').addEventListener('click', () => {
    showScreen('screen-home');
    renderHome();
  });

  $('#fb-btn').addEventListener('click', () => {
    startLevel(current.levelIdx);
  });

  $('#reward-btn').addEventListener('click', () => {
    showScreen('screen-home');
    renderHome();
  });

  $('#btn-garden').addEventListener('click', () => {
    showScreen('screen-garden');
    setTimeout(() => {
      if (!Garden3D.isInited()) Garden3D.init();
      Garden3D.refresh();
    }, 80);
  });

  $('#garden-back').addEventListener('click', () => {
    showScreen('screen-home');
    renderHome();
  });
}

/* =========================================================

   ========================================================= */
function init() {
  Feedback3D.init();
  Reward3D.init();
  bindEvents();
  renderHome();
  showScreen('screen-home');
}
